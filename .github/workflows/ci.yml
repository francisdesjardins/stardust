name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Install ──────────────────────────────────────────────────────────────────
  # Runs npm ci once and saves node_modules to cache. Downstream jobs restore
  # from the same key and skip installation entirely on a cache hit.
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Restore node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            playground/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  # ── Lint & Format ────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            playground/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm run lint
      - run: npm run format:check

  # ── Type Check ───────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            playground/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - run: npm run type-check

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            playground/node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx --workspace=packages/core playwright test --project=unit
      - run: npx --workspace=packages/react playwright test --project=unit
      - run: npx --workspace=packages/solid playwright test --project=unit

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            packages/core/playwright-report/
            packages/react/playwright-report/
            packages/solid/playwright-report/
          retention-days: 7

  # ── Component Tests ──────────────────────────────────────────────────────────
  test-component:
    name: Component Tests (React)
    needs: install
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - run: npx --workspace=packages/react playwright test --project=component

      - name: Upload component test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-report
          path: packages/react/playwright-report/
          retention-days: 7
